<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiro Usage</title>
    <style>
        body {
            font-family: var(--oc-font, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
            margin: 0;
            padding: 16px;
            background: var(--oc-bg, #1a1a1a);
            color: var(--oc-fg, #e0e0e0);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--oc-primary-text, var(--oc-fg, #e0e0e0));
        }
        .refresh-btn {
            background: var(--oc-elevated, #3a3a3a);
            border: 1px solid var(--oc-border, #555);
            color: var(--oc-fg, #e0e0e0);
            padding: 6px 12px;
            border-radius: var(--oc-radius, 4px);
            cursor: pointer;
            font-size: 14px;
        }
        .refresh-btn:hover {
            background: var(--oc-hover, #444);
        }
        .account {
            background: var(--oc-elevated, #2a2a2a);
            border-radius: var(--oc-radius, 6px);
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--oc-border, #333);
        }
        .email {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--oc-primary-text, var(--oc-fg, #e0e0e0));
        }
        .progress-bar {
            height: 8px;
            background: var(--oc-muted-surface, #444);
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
        }
        .progress-fill.green { background: var(--oc-success, #2ecc71); }
        .progress-fill.orange { background: var(--oc-warning, #f39c12); }
        .progress-fill.red { background: var(--oc-error, #e74c3c); }
        .usage-text {
            font-size: 14px;
            margin-top: 4px;
            color: var(--oc-info-text, var(--oc-fg, #e0e0e0));
        }
        .error-text {
            color: var(--oc-error-text, #e74c3c);
            font-size: 14px;
        }
        .summary {
            background: var(--oc-elevated, #2a2a2a);
            border-radius: var(--oc-radius, 6px);
            padding: 12px;
            margin-top: 16px;
            font-weight: 500;
            color: var(--oc-primary-text, var(--oc-fg, #e0e0e0));
            border: 1px solid var(--oc-border, #333);
        }
        .last-updated {
            text-align: center;
            font-size: 12px;
            color: var(--oc-muted, #888);
            margin-top: 16px;
        }
        .loading, .error-message {
            text-align: center;
            padding: 40px;
            color: var(--oc-muted, #888);
        }
        .error-message {
            color: var(--oc-error-text, #e74c3c);
        }
        .pace {
            margin-top: 16px;
        }
        .pace-label {
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--oc-info-text, var(--oc-fg, #e0e0e0));
        }
        .pace-bar {
            position: relative;
            height: 10px;
            background: var(--oc-muted-surface, #444);
            border-radius: 4px;
            overflow: hidden;
        }
        .pace-bar-fill {
            position: absolute;
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .pace-bar-fill.green { background: var(--oc-success, #2ecc71); }
        .pace-bar-fill.red { background: var(--oc-error, #e74c3c); }
        .pace-marker {
            position: absolute;
            width: 2px;
            height: 100%;
            background: var(--oc-fg, #fff);
            transform: translateX(-50%);
        }
        .pace-status.ok { color: var(--oc-success-text, #2ecc71); }
        .pace-status.over { color: var(--oc-error-text, #e74c3c); }
        
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            background: var(--oc-elevated, #2a2a2a);
            border-radius: var(--oc-radius, 6px);
            padding: 4px;
        }
        .tab {
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: var(--oc-muted, #888);
            border-radius: var(--oc-radius, 4px);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .tab:hover {
            color: var(--oc-fg, #e0e0e0);
        }
        .tab.active {
            background: var(--oc-primary-text, #e0e0e0);
            color: var(--oc-bg, #1a1a1a);
            font-weight: 500;
        }
        
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
            background: var(--oc-elevated, #2a2a2a);
            border-radius: var(--oc-radius, 6px);
            padding: 12px;
            border: 1px solid var(--oc-border, #333);
            min-width: 0;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .filter-label {
            font-size: 12px;
            color: var(--oc-muted, #888);
        }
        .filter-input, .filter-select {
            background: var(--oc-bg, #1a1a1a);
            border: 1px solid var(--oc-border, #555);
            color: var(--oc-fg, #e0e0e0);
            padding: 6px 10px;
            border-radius: var(--oc-radius, 4px);
            font-size: 13px;
        }
        .filter-input:focus, .filter-select:focus {
            outline: none;
            border-color: var(--oc-primary-text, #e0e0e0);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--oc-muted, #888);
        }
        
        .request-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .request-row {
            background: var(--oc-elevated, #2a2a2a);
            border-radius: var(--oc-radius, 6px);
            padding: 10px 12px;
            border: 1px solid var(--oc-border, #333);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .request-row:hover {
            border-color: var(--oc-primary-text, #e0e0e0);
        }
        
        .request-header {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 13px;
        }
        
        .request-time {
            color: var(--oc-muted, #888);
            font-family: monospace;
            font-size: 12px;
        }
        
        .request-email {
            font-weight: 500;
            color: var(--oc-primary-text, #e0e0e0);
            flex: 1;
            min-width: 100px;
        }
        
        .request-model {
            color: var(--oc-info-text, #b0b0b0);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .request-status {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            min-width: 50px;
            text-align: center;
        }
        .request-status.ok { background: rgba(46, 204, 113, 0.15); color: var(--oc-success-text, #2ecc71); }
        .request-status.error { background: rgba(231, 76, 60, 0.15); color: var(--oc-error-text, #e74c3c); }
        
        .request-details {
            margin-top: 10px;
            padding: 10px;
            background: var(--oc-bg, #1a1a1a);
            border-radius: var(--oc-radius, 4px);
            border: 1px solid var(--oc-border, #444);
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
        }
        .request-details pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .pagination {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            justify-content: center;
            align-items: center;
        }
        
        .pagination-btn {
            padding: 6px 12px;
            background: var(--oc-elevated, #3a3a3a);
            border: 1px solid var(--oc-border, #555);
            color: var(--oc-fg, #e0e0e0);
            border-radius: var(--oc-radius, 4px);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .pagination-btn:hover:not(:disabled) {
            background: var(--oc-hover, #444);
        }
        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--oc-muted, #888);
        }
        .empty-state h3 {
            margin: 0 0 8px 0;
            color: var(--oc-primary-text, #e0e0e0);
            font-size: 16px;
        }
        .empty-state p {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
        }
        .empty-state code {
            background: var(--oc-elevated, #2a2a2a);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            color: var(--oc-warning-text, #f39c12);
        }

        /* Chart styles */
        .uc {
            margin-top: 24px;
            padding: 16px;
            background: var(--oc-elevated, #2a2a2a);
            border-radius: var(--oc-radius, 6px);
            border: 1px solid var(--oc-border, #333);
            min-width: 0;
        }
        .uc-head {
            margin-bottom: 16px;
        }
        .uc-head h2 {
            margin: 0 0 4px 0;
            font-size: 18px;
            color: var(--oc-primary-text, #e0e0e0);
            font-weight: 600;
        }
        .uc-summary {
            margin: 0;
            font-size: 13px;
            color: var(--oc-muted, #888);
        }
        .uc-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .uc-seg {
            display: inline-flex;
            gap: 4px;
            background: var(--oc-bg, #1a1a1a);
            border-radius: var(--oc-radius, 4px);
            padding: 2px;
        }
        .uc-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: var(--oc-muted, #888);
            border-radius: var(--oc-radius, 3px);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .uc-btn:hover {
            color: var(--oc-fg, #e0e0e0);
        }
        .uc-btn.active {
            background: var(--oc-primary-text, #e0e0e0);
            color: var(--oc-bg, #1a1a1a);
            font-weight: 500;
        }
        .uc-reset {
            background: var(--oc-hover, #444);
            color: var(--oc-fg, #e0e0e0);
            border: 1px solid var(--oc-border, #555);
        }
        .uc-legend {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .uc-chip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            padding: 4px 8px;
            border: 1px solid var(--oc-border, #555);
            background: transparent;
            color: var(--oc-muted, #888);
            border-radius: var(--oc-radius, 4px);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        .uc-chip:hover {
            border-color: var(--oc-fg, #e0e0e0);
            color: var(--oc-fg, #e0e0e0);
        }
        .uc-chip.active {
            border-color: var(--oc-primary-text, #e0e0e0);
            color: var(--oc-fg, #e0e0e0);
            background: rgba(227, 102, 241, 0.1);
        }
        .uc-swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
        .uc-name {
            font-weight: 500;
        }
        .uc-rate {
            font-size: 11px;
            color: var(--oc-muted, #888);
        }
        .uc-total {
            font-size: 11px;
            color: var(--oc-info-text, #b0b0b0);
            margin-left: 4px;
        }
        .uc-plot {
            position: relative;
            display: flex;
            min-width: 0;
            overflow: hidden;
            gap: 8px;
            margin-bottom: 16px;
            min-height: 240px;
        }
        .uc-yaxis {
            display: flex;
            flex-direction: column-reverse;
            justify-content: space-between;
            flex: 0 0 40px;
            font-size: 11px;
            color: var(--oc-muted, #888);
            text-align: right;
            padding-right: 8px;
        }
        .uc-plot svg {
            flex: 1 1 auto;
            min-width: 0;
            border-left: 1px solid var(--oc-border, #555);
            border-bottom: 1px solid var(--oc-border, #555);
            width: 100%;
            height: 200px;
            overflow: visible;
            touch-action: none;
            user-select: none;
        }
        .uc-brush {
            fill: var(--oc-primary-text, #e0e0e0);
            opacity: 0.15;
            pointer-events: none;
        }
        .uc-bar {
            cursor: pointer;
            transition: opacity 0.15s ease;
        }
        .uc-bar:hover {
            opacity: 0.8;
        }
        .uc-hit {
            fill: transparent;
            cursor: pointer;
        }
        .uc-hit:focus {
            outline: 2px solid var(--oc-primary-text, #e0e0e0);
            outline-offset: -1px;
        }
        .uc-label {
            font-size: 11px;
            fill: var(--oc-muted, #888);
            text-anchor: middle;
        }
        .uc-tip {
            position: absolute;
            bottom: 210px;
            background: var(--oc-bg, #1a1a1a);
            border: 1px solid var(--oc-border, #555);
            border-radius: var(--oc-radius, 4px);
            padding: 8px 10px;
            font-size: 12px;
            color: var(--oc-fg, #e0e0e0);
            pointer-events: none;
            z-index: 100;
            max-width: 200px;
            white-space: nowrap;
        }
        .uc-live {
            display: none;
        }
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .uc-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: var(--oc-muted, #888);
            font-size: 14px;
        }
        .uc-empty p {
            margin: 0;
        }
        .uc-foot {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--oc-border, #444);
            font-size: 12px;
            color: var(--oc-muted, #888);
        }
        .uc-foot p {
            margin: 4px 0;
        }
        .uc[aria-busy="true"] {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Kiro Usage</h1>
        <button class="refresh-btn" id="refresh">Refresh</button>
    </div>
    
    <div class="tabs">
        <button class="tab active" data-view="usage">Usage</button>
        <button class="tab" data-view="requests">Requests</button>
    </div>
    
    <div id="content"></div>
    <script src="main.js"></script>
</body>
</html>
